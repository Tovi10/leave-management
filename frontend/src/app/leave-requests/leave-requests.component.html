<h2>Leave Requests</h2>

<app-leave-request-form [employees]="employees" (created)="load()"></app-leave-request-form>

<div *ngIf="loading">Loading...</div>

<table *ngIf="!loading">
  <thead>
    <tr>
      <th>#</th>
      <th>Employee</th>
      <th>Type</th>
      <th>Start</th>
      <th>End</th>
      <th>Days</th>
      <th>Status</th>
      <th></th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let r of requests">
      <td>{{ r.id }}</td>
      <td>{{ r.employee?.name }}</td>
      <td>{{ typeLabel(r.type) }}</td>
      <td>{{ r.startDate | date: 'dd/MM/yyyy' }}</td>
      <td>{{ r.endDate | date: 'dd/MM/yyyy' }}</td>
      <td>{{ r.days }}</td>
      <td>{{ statusLabel(r.status) }}</td>
      <td>
        <button
          *ngIf="r.status === 0"
          class="approve-button"
          [disabled]="isApproving(r.id)"
          [attr.aria-busy]="isApproving(r.id)"
          (click)="approve(r.id)">
          <span *ngIf="isApproving(r.id)" class="loading-indicator" aria-hidden="true"></span>
          {{ isApproving(r.id) ? 'Approving...' : 'Approve' }}
        </button>
        <div
          *ngIf="approvalFeedback.get(r.id) as feedback"
          class="approval-feedback"
          [class.success]="feedback.kind === 'success'"
          [class.error]="feedback.kind === 'error'"
          [attr.role]="feedback.kind === 'error' ? 'alert' : 'status'"
          aria-live="polite">
          {{ feedback.message }}
        </div>
      </td>
    </tr>
  </tbody>
</table>
